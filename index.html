<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureLogin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f3f5;
      font-family: Arial, sans-serif;
      color: #202124;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { text-align: center; margin: 0 0 8px; }
    .sub { text-align: center; color: #777; margin-bottom: 25px; }
    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button.secondary { background: #e9ecef; color: #222; }
    button:disabled { opacity: .6; cursor: wait; }
    .switch {
      text-align: center;
      margin-top: 18px;
      color: #555;
      font-size: 14px;
    }
    .switch a { color: #222; cursor: pointer; font-weight: bold; }
    #message { text-align: center; font-size: 14px; margin-top: 15px; }
    .hidden { display: none; }
    .user-name { text-align: center; font-size: 23px; margin: 25px 0; }
  </style>
</head>
<body>

  <main class="card">
    <section id="authSection">
      <h1>SecureLogin</h1>
      <p class="sub" id="formTitle">Sign in to your account</p>

      <form id="authForm">
        <input id="fullName" type="text" placeholder="Full name"
               autocomplete="name" class="hidden" />
        <input id="email" type="email" placeholder="Email"
               autocomplete="email" required />
        <input id="password" type="password" placeholder="Password"
               autocomplete="current-password" minlength="8" required />
        <button id="submitButton" type="submit">Sign in</button>
      </form>

      <div class="switch">
        <span id="switchText">Don't have an account?</span>
        <a id="switchMode">Create account</a>
      </div>
      <p id="message" role="status"></p>
    </section>

    <section id="dashboard" class="hidden">
      <h1>SecureLogin</h1>
      <p class="sub">Dashboard</p>
      <div class="user-name" id="welcomeName"></div>
      <p class="sub">Signed in successfully.</p>
      <button class="secondary" id="logoutButton">Sign out</button>
    </section>
  </main>

<script>
  const SUPABASE_URL = "https://xrhqfnvhktupekxffzuv.supabase.co";
  const SUPABASE_ANON_KEY = "PUT_FULL_Publishable_Key_HERE";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  let isSignup = false;

  const $ = id => document.getElementById(id);
  const message = $("message");

  function showMessage(text, error = false) {
    message.textContent = text;
    message.style.color = error ? "#c62828" : "#16803c";
  }

  function setMode(signup) {
    isSignup = signup;
    $("formTitle").textContent = signup ? "Create a new account" : "Sign in to your account";
    $("fullName").classList.toggle("hidden", !signup);
    $("fullName").required = signup;
    $("password").autocomplete = signup ? "new-password" : "current-password";
    $("submitButton").textContent = signup ? "Create account" : "Sign in";
    $("switchText").textContent = signup ? "Already have an account?" : "Don't have an account?";
    $("switchMode").textContent = signup ? "Sign in" : "Create account";
    showMessage("");
  }

  $("switchMode").addEventListener("click", () => setMode(!isSignup));

  async function showDashboard(user) {
    $("authSection").classList.add("hidden");
    $("dashboard").classList.remove("hidden");

    const { data } = await db
      .from("profiles")
      .select("full_name")
      .eq("id", user.id)
      .maybeSingle();

    const name = data?.full_name ||
      user.user_metadata?.full_name ||
      user.email;

    $("welcomeName").textContent = "Welcome, " + name;
  }

  $("authForm").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("submitButton");
    button.disabled = true;
    showMessage("Please wait...");

    const email = $("email").value.trim();
    const password = $("password").value;

    try {
      if (isSignup) {
        const fullName = $("fullName").value.trim();

        const { data, error } = await db.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName }
          }
        });

        if (error) throw error;

        if (data.session) {
          await showDashboard(data.user);
        } else {
          showMessage("Account created. Check your email to confirm it.");
        }
      } else {
        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        await showDashboard(data.user);
      }
    } catch (error) {
      showMessage(error.message || "Something went wrong. Please try again.", true);
    } finally {
      button.disabled = false;
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();
    if (error) {
      showMessage(error.message, true);
      return;
    }
    $("dashboard").classList.add("hidden");
    $("authSection").classList.remove("hidden");
    $("authForm").reset();
    setMode(false);
  });

  async function init() {
    const { data } = await db.auth.getSession();
    if (data.session) {
      await showDashboard(data.session.user);
    }
  }

  init();
</script>
</body>
</html>
