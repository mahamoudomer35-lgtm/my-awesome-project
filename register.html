<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#000000">
        <title>Register | SomaZon</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body class="" data-auth-page="register">
        <main class="auth-page">
            <section class="auth-card">
                <div class="auth-brand">
                    <a class="logo" href="index.html">
                        <span class="logo-mark">S</span>
                        <span class="soma">Soma</span>
                        <span class="zon">Zon</span>
                    </a>
                </div>
                <h1>Create your SomaZon account</h1>
                <p class="auth-subtitle">Join the marketplace and start exploring.</p>
                <form id="authForm">
                    <div class="field">
                        <label for="authName">Full name</label>
                        <input id="authName" name="name" type="text" autocomplete="name" placeholder="Your full name" required minlength="2">
                    </div>
                    <div class="field">
                        <label for="authEmail">Email address</label>
                        <input id="authEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <label for="authPassword">Password</label>
                        <input id="authPassword" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
                    </div>
                    <div id="authAlert" class="auth-alert hidden" role="status"></div>
                    <button id="authSubmit" class="btn btn-gold btn-full" type="submit">Create account</button>
                </form>
                <p class="auth-switch">Already have an account? 
                    <a href="login.html">Sign in</a>
                </p>
                <a class="auth-back" href="index.html">← Back to marketplace</a>
            </section>
        </main>
        <script src="js/supabase.js"></script>
        <script src="js/auth.js"></script>
    </body>
</html>
